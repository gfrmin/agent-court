name: book
# Builds the book on every change (a red build here is a broken chapter), keeps the
# built site as a downloadable artifact, and asks gfrm.in to republish /book/ when a
# dispatch token is configured. The book's public home is https://gfrm.in/book/,
# built by gfrmin/gfrminsite's publish workflow from this repository's chapters/.
on:
  push:
    branches: [master]
    paths: ["chapters/**", "book.toml", "theme/**", "sources.md", "plan.md", ".github/workflows/book.yml"]
  pull_request:
    paths: ["chapters/**", "book.toml", "theme/**"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install mdBook
        run: |
          curl -sSL https://github.com/rust-lang/mdBook/releases/download/v0.4.52/mdbook-v0.4.52-x86_64-unknown-linux-gnu.tar.gz | tar xz
          ./mdbook --version
      - name: Build
        run: MDBOOK_OUTPUT__HTML__SITE_URL=/book/ ./mdbook build
      - uses: actions/upload-artifact@v4
        with:
          name: book-site
          path: book-site
          retention-days: 14
      - name: Ask gfrm.in to republish /book/
        if: github.event_name == 'push' && env.TOKEN != ''
        env:
          TOKEN: ${{ secrets.GFRMINSITE_DISPATCH_TOKEN }}
        run: |
          curl -sS -X POST -H "Authorization: Bearer $TOKEN" -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/gfrmin/gfrminsite/dispatches \
            -d '{"event_type":"book-updated","client_payload":{"sha":"${{ github.sha }}"}}'
