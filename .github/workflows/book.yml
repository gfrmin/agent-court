name: book
# Builds the book on every change (a red build here is a broken chapter), keeps the
# built site as a downloadable artifact, and asks gfrm.in to republish /book/ when a
# dispatch token is configured. The book's public home is https://gfrm.in/book/,
# built by gfrmin/gfrminsite's publish workflow from this repository's chapters/.
on:
  push:
    branches: [master]
    paths: ["chapters/**", "book.toml", "theme/**", "sources.md", "plan.md", ".github/workflows/book.yml",
            ".mdbook-version", ".mdbook-sha256", "scripts/install-mdbook.sh"]
  # chapters/sources.md and chapters/plan.md are symlinks to the root files, so an
  # edit to either root file does not match chapters/**; both are listed here.
  pull_request:
    paths: ["chapters/**", "book.toml", "theme/**", "sources.md", "plan.md", ".github/workflows/book.yml",
            ".mdbook-version", ".mdbook-sha256", "scripts/install-mdbook.sh"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    # Only whether the dispatch token exists is job-wide; the token itself stays on
    # the one step that uses it, out of reach of the installer and the mdBook build.
    env:
      HAS_DISPATCH_TOKEN: ${{ secrets.GFRMINSITE_DISPATCH_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v4
      # The version and its sha256 are pinned in .mdbook-version / .mdbook-sha256.
      # gfrminsite pins mdBook separately (its own copies of these files and of the
      # installer) and only warns when its version differs from this one, so bump
      # both repositories together.
      - name: Install mdBook
        run: scripts/install-mdbook.sh
      # site-url (/book/) comes from book.toml alone; do not override it here.
      - name: Build
        run: ./mdbook build
      - uses: actions/upload-artifact@v4
        with:
          name: book-site
          path: book-site
          retention-days: 14
      # Ask gfrm.in to republish /book/ at this commit. Optional: without the secret,
      # gfrminsite's nightly run picks the book up instead. The secret is a
      # fine-grained PAT on gfrmin/gfrminsite with Actions: write and nothing else.
      # That permission starts a workflow_dispatch run but cannot push code. The
      # repository_dispatch endpoint would need Contents: write, which can.
      # A failed dispatch must not fail the run: gfrminsite's fallback builds from the
      # last *green* push here, so a red run would hide a good book from it as well.
      - name: Ask gfrm.in to republish /book/
        if: github.event_name == 'push' && env.HAS_DISPATCH_TOKEN == 'true'
        continue-on-error: true
        env:
          GFRMINSITE_DISPATCH_TOKEN: ${{ secrets.GFRMINSITE_DISPATCH_TOKEN }}
        run: |
          curl -fsS -X POST \
            -H "Authorization: Bearer $GFRMINSITE_DISPATCH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/gfrmin/gfrminsite/actions/workflows/publish.yml/dispatches \
            -d '{"ref":"master","inputs":{"book_sha":"${{ github.sha }}"}}'
