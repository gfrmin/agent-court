[book]
title = "A Court for Agents"
authors = ["Guy Freeman"]
description = "How to build a system that acts for us after we have stopped watching, through AI helpers we cannot fully trust. The monograph of jack, in first draft."
language = "en"
src = "chapters"

[build]
build-dir = "book-site"
create-missing = false

[output.html]
default-theme = "light"
preferred-dark-theme = "ayu"
mathjax-support = false
git-repository-url = "https://github.com/gfrmin/agent-court"
edit-url-template = "https://github.com/gfrmin/agent-court/edit/master/{path}"
site-url = "/book/"
additional-css = ["theme/draft.css"]
additional-js = ["theme/provenance.js"]

[output.html.search]
enable = true
limit-results = 20

[output.html.print]
enable = true
