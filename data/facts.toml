# ------------------------------------------------------------------ the book about itself

[count.appendix_a_rows]
# A.2–A.16: each result is a ### heading; A.0, A.1, A.17 and A.18 are ## sections.
file = "chapters/app-a-the-necessities.md"
pattern = '^### A\.\d+ '
expect = 15
phrase = [
  { text = "The {words} rows above", in = ["chapters/app-a-the-necessities.md"] },
  { text = "{Words} Things a Self-Modifying Agent", in = ["essays/necessities/index.md"] },
  { text = "{Words} old results", in = ["essays/necessities/index.md"] },
  { text = "One of the {words} fails", in = ["essays/necessities/index.md"] },
]

[count.residue_bets]
# Chapter 15's bets, each written "*p* 0.xx". The first draft said "ten" when it
# held twelve; this count is why that cannot recur.
file = "chapters/ch-15-residue.md"
pattern = '\*p\* 0\.\d+'
expect = 13
phrase = [
  { text = "{words} probabilities between", in = ["chapters/ch-15-residue.md"] },
]

# ------------------------------------------------------------------ citations

[citations]
# Capitalised words that the citation pattern can take for a surname before a
# year. Add to this only after reading the hit; a real citation goes in sources.md.
not_names = ["In", "LCF", "Share"]
# Entries in sources.md that no chapter or essay cites by author and year, on
# purpose, as "surname year" with accents stripped and in lower case. Empty since
# the three orphaned by the re-cut (D20) were placed again in chapters 0 and 4 (#22).
uncited_ok = []
