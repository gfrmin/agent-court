# The figures the book prints, each with the commit of renavondata/jack it was
# recomputed at and the method that recomputes it. tools/check_book.py recomputes
# every one and fails if it differs from `value`, then finds every phrase below in
# every chapter and fails if the number printed in it is not `value`.
#
# A phrase is a template with one placeholder, written as the number would be
# printed: {n} plain, {comma} with thousands separators, {fraction} as p/q,
# {words} / {Words} as an English number word, {instant} as a UTC timestamp. The rest
# of the phrase is matched
# literally (spaces match any whitespace), so it should be specific enough to mean
# only this figure: "100,000 seeded logs and {comma} prefixes", not "{comma}
# prefixes", which would also catch the other run of record.
#
# `in` names the files that must carry the phrase at least once. A phrase found in
# a file not named is still checked, which is how a stale copy is caught.
#
# `how` is fold (a count over the log), files (a field summed over transcripts), command
# (a jack tool run at the commit) or text (a figure a jack document states, by `extract`
# or `count`).
#
# To change a figure: change `commit` and `value` together, run the checker, and
# fix every place it names. Never change `value` alone.

[pins]
# The commit a chapter's quotations are checked against when the chapter does not
# name one in its header ("the record is `renavondata/jack` at `…`").
jack = "6ebea1a"

